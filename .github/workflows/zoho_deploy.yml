name: Deploy to Zoho Catalyst

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Catalyst
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Node.js (for Catalyst CLI)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Catalyst CLI
        run: npm install -g zcatalyst-cli

      - name: Build Web Client (React)
        run: |
          cd user
          npm install
          npm run build
        env:
          VITE_POLICE_API_URL: ${{ secrets.VITE_POLICE_API_URL }}

      - name: Deploy to Zoho Catalyst
        run: catalyst deploy --token ${{ secrets.CATALYST_TOKEN }}
