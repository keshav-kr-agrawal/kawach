# Render Blueprint — deploys both KAWACH services.
# Render dashboard → New → Blueprint → pick this GitHub repo → it reads this file.
# sync:false vars must be set manually in the Render dashboard for each service.

services:
  # ── 1. Police Backend (Python / FastAPI) ───────────────────────────────────
  - type: web
    name: kawach-police
    runtime: python
    plan: free
    rootDir: police/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"   # force stdout to flush immediately — without this, print()
                      # logs can vanish or appear wildly out of order in Render's
                      # log viewer (bit us diagnosing the Gemini key issue)
      - key: PYTHONUTF8
        value: "1"   # CRITICAL: without this, Render's default locale isn't
                      # UTF-8, and any print() of Gemini's emoji-laden response
                      # text throws UnicodeEncodeError — silently caught by
                      # nayak.py's broad except and disguised as a "Gemini
                      # error", making every chat fall back to the canned
                      # template even with a perfectly valid API key.
                      # Reproduced and confirmed as the root cause 2026-07-19.
      - key: DATABASE_URL
        sync: false   # Supabase → Settings → Database → Connection string (URI)
      - key: GEMINI_API_KEY
        sync: false   # Google AI Studio key (Nayak agent)
      - key: JWT_SECRET
        sync: false   # any long random string
      - key: CLASSIFIER_URL
        value: https://hikity-kawach-classifier.hf.space
      # SEED_ON_START removed 2026-07-19 — auto-seeding on boot ran
      # Base.metadata.drop_all() against the real production database on
      # every cold start. Table creation is safe/automatic (main.py
      # create_all, additive-only); if you want demo FIR/offender data, run
      # `DATABASE_URL=<target> python -m app.scripts.generate_data` manually,
      # once, deliberately — never as part of the boot sequence.

  # ── 2. Citizen User App (React / Vite — Static Site) ──────────────────────
  - type: web
    name: kawach-user
    runtime: static
    rootDir: user
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # SPA fallback — React Router handles all client-side paths
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_POLICE_API_URL
        value: https://kawach-police.onrender.com
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_CLOUDINARY_CLOUD_NAME
        value: kijqhnss
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        value: kawach_preset
      - key: VITE_CLASSIFIER_API_URL
        value: https://hikity-kawach-classifier.hf.space/classify
