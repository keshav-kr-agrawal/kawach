# Render Blueprint — deploys the KAWACH police backend (free tier, no Docker).
# Render dashboard → New → Blueprint → pick this GitHub repo → it reads this file.
# The four sync:false vars are prompted for / set in the dashboard (kept out of git).

services:
  - type: web
    name: kawach-police
    runtime: python
    plan: free
    rootDir: police/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false   # Supabase → Settings → Database → Connection string (URI)
      - key: GEMINI_API_KEY
        sync: false   # Google AI Studio key (Nayak agent)
      - key: JWT_SECRET
        sync: false   # any long random string
      - key: CLASSIFIER_URL
        value: https://hikity-kawach-classifier.hf.space
      - key: SEED_ON_START
        value: "1"    # first boot: creates tables + demo data on empty DB; set to 0 afterwards
