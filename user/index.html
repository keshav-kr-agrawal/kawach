    <title>Sentinel App</title>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('Sentinel PWA Service Worker Registered', reg);
          }).catch((err) => {
            console.warn('Sentinel PWA SW Registration Failed', err);
          });
        });
      }
    </script>
  </body>
